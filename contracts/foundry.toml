[profile.default]
src = "src"
out = "out"
libs = ["lib"]
allow_paths = ["../node_modules"]
test = "test"
cache_path = "cache"
solc_version = "0.8.37"
# Keep bytecode compatible with the existing target while upgrading the compiler.
evm_version = "paris"
optimizer = true
optimizer_runs = 200
extra_output = ["storageLayout"]

remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts-upgradeable/=../node_modules/@openzeppelin/contracts-upgradeable/",
    "@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/"
]

[rpc_endpoints]
coston2 = "${RPC_URL}"
flare = "${RPC_URL}"
