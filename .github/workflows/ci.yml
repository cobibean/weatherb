name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@12.0.2
      - run: npm ci
      - run: npm run setup:contracts
      - name: Install disposable database tooling
        run: sudo apt-get update && sudo apt-get install -y postgresql-16
      - run: npm run verify
        env:
          WEATHERB_PG_BIN: /usr/lib/postgresql/16/bin
